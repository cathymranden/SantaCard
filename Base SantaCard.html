<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operación Navidad 2026</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff5de;font-family:Georgia,serif;padding:18px;display:grid;place-items:center;min-height:100svh}main{width:min(100%,1000px);background:radial-gradient(ellipse at top,#205540,#09291e 75%);border:1px solid #a98c4e;border-radius:16px;min-height:410px;padding:32px 18px;text-align:center;position:relative;overflow:hidden}#content{position:relative}h1{font-size:30px;line-height:1.15;margin:12px 0;color:#fce8ad}h2{font-size:24px;color:#fce8ad}p{font-size:15px;line-height:1.6;margin:8px 0}small{font-family:Arial,sans-serif;letter-spacing:2px;font-size:10px;color:#c2d2c9}button,a.buy{cursor:pointer;border:1px solid #d9b972;background:#a22b33;color:#fff5de;font:bold 15px Georgia;border-radius:8px;padding:12px 17px;margin:5px;display:inline-block;text-decoration:none}button:hover{background:#ca3b44}.plain{background:transparent}.seal{width:78px;height:78px;border:3px double #e9c989;background:#972a2f;border-radius:50%;margin:20px auto;display:grid;place-items:center;font-size:38px;box-shadow:0 4px 14px #0005}.gift{background:#ffffff0d;border:1px solid #c9b67d55;border-radius:10px;padding:12px;margin:8px auto;max-width:440px;text-align:left;display:flex;align-items:center;gap:12px}.gift span{font-size:28px}.gift button{margin-left:auto;font-size:12px;padding:8px}.snow{position:absolute;top:-15px;pointer-events:none;color:#fff7;animation:snowfall linear infinite}@keyframes snowfall{to{transform:translateY(900px) rotate(180deg)}}.progress{background:#ffffff24;border-radius:20px;height:13px;max-width:300px;margin:12px auto;overflow:hidden}.progress i{display:block;background:#e7c16b;height:100%;width:0;transition:width 1.5s}.muted{color:#dbcba8;font-size:12px}img{max-width:220px;max-height:240px;border-radius:8px}@media(prefers-reduced-motion:reduce){.snow{animation:none}.progress i{transition:none}}</style></head><body><main><div id="flakes" aria-hidden="true"></div><div id="content"><small>DEPARTAMENTO DE ASUNTOS NAVIDEÑOS</small><div id="screen"></div></div></main><script>
const s=document.querySelector('#screen');for(let i=0;i<22;i++){const n=document.createElement('span');n.className='snow';n.textContent='❄';n.style.cssText=`left:${(i*37)%100}%;font-size:${8+i%9}px;animation-duration:${6+i%7}s;animation-delay:-${i%11}s`;document.querySelector('#flakes').appendChild(n)}
function home(){s.innerHTML=`<div class="seal">🎅</div><small>EXPEDIENTE N° 25122026</small><h1>Operación Navidad</h1><p>Documento estrictamente confidencial.<br>Exclusivo para Papá Noel y sus patrocinadores.</p><button id="enter">Desclasificar expediente →</button><p class="muted">Polo Norte · Navidad 2026</p>`;s.querySelector('#enter').onclick=check}
function check(){s.innerHTML=`<div class="seal">🕵️</div><h2>Verificación de identidad</h2><p>¿Usted es Papá Noel o uno de sus colaboradores con capacidad adquisitiva?</p><button id="yes">Sí, estoy autorizado</button><button class="plain" id="no">Solo vine a mirar</button><p id="msg"></p>`;s.querySelector('#yes').onclick=report;s.querySelector('#no').onclick=()=>s.querySelector('#msg').textContent='Se aceptan curiosos, pero también aportes voluntarios. 😂'}
function report(){s.innerHTML=`<h2>Auditoría de comportamiento</h2><p>Analizando desempeño anual...</p><div class="progress"><i></i></div><h1>99,8%</h1><p>De buen comportamiento*</p><p class="muted">*El 0,2% restante se encuentra bajo investigación.<br>Fuente: declaraciones de la propia interesada.</p><p>🎄 Resultado: apta para recibir regalos.</p><button id="list">Consultar solicitudes aprobadas →</button>`;requestAnimationFrame(()=>requestAnimationFrame(()=>s.querySelector('i')&&(s.querySelector('i').style.width='99.8%')));s.querySelector('#list').onclick=gifts}
// Edita los regalos aquí. Los últimos dos campos son la URL de la imagen y el enlace de compra.
const items=[['🎁','Un pequeño caprichito','$15.000','Financieramente responsable','Una oportunidad excelente para demostrar cariño sin comprometer la estabilidad económica.','',''],['🛍️','Mi obsesión del momento','$35.000','Inversión estratégica','Lo he mirado tantas veces que el algoritmo ya está preocupado.','',''],['✨','El regalo de mis sueños','$80.000','Operación de alto impacto','Se aceptan alianzas estratégicas entre familiares y financiamiento colectivo.','','']];
function gifts(){s.innerHTML=`<h2>Catálogo oficial de deseos</h2><p class="muted">Regalos ilustrativos · Catálogo de prueba</p>${items.map((a,i)=>`<div class="gift"><span>${a[0]}</span><div><b>${a[1]}</b><p>${a[2]}</p><div class="muted">${a[3]}</div></div><button data-i="${i}">Ver</button></div>`).join('')}<button class="plain" id="end">Finalizar visita</button>`;s.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>detail(+b.dataset.i));s.querySelector('#end').onclick=finish}
function detail(i){let a=items[i];s.innerHTML=`${a[5]?`<img src="${a[5]}" alt="${a[1]}">`:`<div class="seal">${a[0]}</div>`}<h2>${a[1]}</h2><h1>${a[2]}</h1><p>${a[4]}</p>${a[6]?`<a class="buy" href="${a[6]}" target="_blank" rel="noopener">Comprar regalo</a>`:'<p class="muted">Aquí iría la fotografía y el enlace real de compra.</p>'}<button id="back">Volver al catálogo</button>`;s.querySelector('#back').onclick=gifts}
function finish(){s.innerHTML=`<div class="seal">💌</div><h2>¡Muchas gracias!</h2><p>Su visita ha sido registrada en el corazón de la solicitante.</p><p>Se recuerda que el cariño no tiene precio...<br>pero los regalos sí.</p><h1>¡Feliz Navidad!</h1><button id="restart">Volver al inicio</button>`;s.querySelector('#restart').onclick=home}home();</script></body></html>
